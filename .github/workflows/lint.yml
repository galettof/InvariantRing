name: Lint
on:
  push:
    branches:
    - development
    - 'feature/**'
  pull_request:
    branches:
    - development
    - 'feature/**'

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          sudo apt-get install -y codespell
      - name: Run codespell
        shell: bash -l {0}
        run: codespell .

env:
  MAKEFLAGS: -j2
