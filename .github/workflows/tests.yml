name: Run tests

on:
  push:
    branches:
    - development
    - 'feature/**'
  pull_request:
    branches:
    - development
    - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Macaulay2
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:profzoom/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2

      - name: Show Macaulay2 version
        run: M2 --no-readline --silent --eval 'version'

      - name: Run InvariantRing tests
        shell: bash
        env:
          M2PATH: ${{ github.workspace }}
        run: |
          cat > run-tests.m2 <<'EOF'
          loadPackage "InvariantRing";
          check "InvariantRing";
          EOF

          M2 --no-readline --silent run-tests.m2
