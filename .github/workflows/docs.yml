name: Build and publish documentation

on:
  push:
    branches: [ "stable" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Macaulay2
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y macaulay2

      - name: Install InvariantRing and build HTML documentation
        shell: bash
        env:
          M2PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail

          cat > make-docs.m2 <<'EOF'
          installPackage "InvariantRing";
          EOF

          M2 --script make-docs.m2

          HTML_DIR="$HOME/.Macaulay2/local/share/doc/Macaulay2/InvariantRing/html"
          SITE="$RUNNER_TEMP/site"

          if [[ ! -d "$HTML_DIR" ]]; then
            echo "Could not find generated documentation at:"
            echo "  $HTML_DIR"
            find "$HOME/.Macaulay2" -type f -print || true
            exit 1
          fi

          mkdir -p "$SITE"
          cp -a "$HTML_DIR"/. "$SITE"/

          STYLE_DIR="/usr/share/Macaulay2/Style"

          if [[ ! -d "$STYLE_DIR" ]]; then
            echo "Could not find Macaulay2 style files at:"
            echo "  $STYLE_DIR"
            exit 1
          fi

          mkdir -p "$SITE/Style"
          cp -aL "$STYLE_DIR"/. "$SITE/Style"/

          export SITE

          python3 <<'PY'
          import os
          from pathlib import Path

          site = Path(os.environ["SITE"]).resolve()
          old_prefix = "/usr/share/Macaulay2/Style/"

          for html_file in site.rglob("*.html"):
              text = html_file.read_text(encoding="utf-8")

              if old_prefix in text:
                  text = text.replace(old_prefix, 'Style/')
                  html_file.write_text(text, encoding="utf-8")
                  print(f"Rewrote style paths in {html_file}")
          
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
